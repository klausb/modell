[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modell"
version = "0.1.0"
description = "LLM-driven Blender modeling system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "smolagents>=1.17",
  "typer>=0.12",
]

[project.scripts]
modell = "modell.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["modell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
